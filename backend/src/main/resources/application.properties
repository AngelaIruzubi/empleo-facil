spring.application.name=backend

# Lee las variables del archivo .env si existe (nunca se sube a Git)
spring.config.import=optional:file:.env[.properties]

# Ollama. Formato ${VARIABLE:valor por defecto}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# El modelo tiene que estar descargado: ollama pull gemma3:4b
# gemma3:4b adapta mejor que llama3.2 (ver evals/resultados)
spring.ai.ollama.chat.model=${OLLAMA_MODEL:gemma3:4b}
# Temperatura baja: respuestas predecibles, con menos inventos
spring.ai.ollama.chat.temperature=${OLLAMA_TEMPERATURE:0.2}
# Tiempo que el modelo se queda cargado en memoria sin usarse. Por defecto Ollama lo descarga a los 5 minutos
# y olvida el prompt ya leído: la siguiente petición tarda unos 90 segundos más (medido en la fase 3).
spring.ai.ollama.chat.keep-alive=${OLLAMA_KEEP_ALIVE:1h}
# Memoria de la IA en tokens: lo que lee (instrucciones, ejemplos y oferta) más lo que escribe.
# Ollama usa 4096 por defecto. Con ofertas largas no llegaba: la IA paraba a mitad del JSON (fase 3).
spring.ai.ollama.chat.num-ctx=${OLLAMA_NUM_CTX:8192}

# Reintentos si la IA falla. Por defecto Spring AI reintenta 10 veces con esperas crecientes,
# y con Ollama apagado la persona esperaría muchos minutos. Con 2 intentos responde enseguida.
spring.ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2

# Pictogramas de ARASAAC. Es una API pública y gratuita: no necesita clave.
arasaac.base-url=${ARASAAC_BASE_URL:https://api.arasaac.org/v1}
