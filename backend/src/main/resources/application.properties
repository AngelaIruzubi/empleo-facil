spring.application.name=backend

# Lee las variables del archivo .env si existe (nunca se sube a Git)
spring.config.import=optional:file:.env[.properties]

# Ollama. Formato ${VARIABLE:valor por defecto}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# El modelo tiene que estar descargado: ollama pull llama3.2
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2}
# Temperatura baja: respuestas predecibles, con menos inventos
spring.ai.ollama.chat.temperature=${OLLAMA_TEMPERATURE:0.2}
